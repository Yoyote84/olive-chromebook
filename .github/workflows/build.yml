name: Build Olive ARM64 (.deb)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:


jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          submodules: recursive


      - name: Configurer QEMU (ARM64)
        uses: docker/setup-qemu-action@v3


      - name: Compilation dans un conteneur Ubuntu ARM64
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          run: |
            apt-get update
            apt-get install -y build-essential cmake pkg-config qtbase5-dev libqt5svg5-dev libgl1-mesa-dev checkinstall
            mkdir -p build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release ..
            make -j$(nproc)
            checkinstall -y --pkgname=olive-editor --pkgversion=0.2.0 --arch=arm64 --provides=olive-editor


      - name: Sauvegarder le fichier .deb
        uses: actions/upload-artifact@v4
        with:
          name: olive-arm64-deb
          path: build/*.deb