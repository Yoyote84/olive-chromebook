name: Build Olive ARM64 (.deb)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          submodules: recursive


      - name: Configurer QEMU (ARM64)
        uses: docker/setup-qemu-action@v3


      - name: Compilation dans un conteneur Ubuntu ARM64
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: aarch64
          distro: ubuntu24.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            apt-get install -y \
              build-essential cmake pkg-config git \
              qtbase5-dev qtbase5-private-dev libqt5opengl5-dev libqt5svg5-dev libqt5x11extras5-dev \
              qttools5-dev qttools5-dev-tools libgl1-mesa-dev \
              libavformat-dev libavcodec-dev libavutil-dev libavfilter-dev \
              libswscale-dev libswresample-dev \
              portaudio19-dev libopencolorio-dev libopenimageio-dev \
              libopenexr-dev libimath-dev checkinstall
          run: |
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            mkdir -p build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr ..
            make -j$(nproc)
            checkinstall -y --default --install=no \
              --pkgname=olive-editor --pkgversion=0.2.0 \
              --arch=arm64 --provides=olive-editor


      - name: Sauvegarder le fichier .deb
        uses: actions/upload-artifact@v4
        with:
          name: olive-arm64-deb
          path: build/*.deb